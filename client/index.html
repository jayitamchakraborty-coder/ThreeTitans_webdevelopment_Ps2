<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Vicinus — Your community. Your information.</title>
    <meta name="description" content="Vicinus is a hyperlocal community knowledge-sharing platform. Discover internships, events, lost items, emergencies and local updates before they get buried.">
    
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
    <link href="https://fonts.googleapis.com" rel="preconnect">
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        /* ── Override slate to NEUTRAL (zero blue) ── */
                        slate: {
                            50:  '#fafafa',
                            100: '#f5f5f5',
                            200: '#e5e5e5',
                            300: '#d4d4d4',
                            400: '#a3a3a3',
                            500: '#737373',
                            600: '#525252',
                            700: '#404040',
                            800: '#171717',
                            900: '#0a0a0a',
                            950: '#030303'
                        },
                        /* ── App tokens ── */
                        "primary":       "#6366f1",
                        "primary-hover": "#4f46e5",
                        "primary-light": "#e0e7ff",
                        "on-primary":    "#ffffff",
                        "surface":       "#fafafa",
                        "surface-card":  "#ffffff",
                        "border-subtle": "#e5e5e5",
                        "on-surface":    "#0a0a0a",
                        /* ── True-black dark surfaces ── */
                        "d-bg":      "#000000",
                        "d-card":    "#0a0a0a",
                        "d-raised":  "#111111",
                        "d-border":  "#1c1c1c",
                        "d-border2": "#282828",
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif']
                    },
                    animation: {
                        'fade-in':   'fadeIn .3s ease-out',
                        'slide-up':  'slideUp .4s cubic-bezier(.22,1,.36,1)',
                        'pulse-dot': 'pulseDot 2s ease-in-out infinite'
                    },
                    keyframes: {
                        fadeIn:   { '0%':{ opacity:'0' },                                '100%':{ opacity:'1' }},
                        slideUp:  { '0%':{ opacity:'0', transform:'translateY(12px)' },  '100%':{ opacity:'1', transform:'translateY(0)' }},
                        pulseDot: { '0%,100%':{ opacity:'1' }, '50%':{ opacity:'.4' }}
                    }
                }
            }
        };
        
        if (localStorage.getItem('theme') === 'dark' || (!localStorage.getItem('theme') && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }
    </script>

    <style>
        /* ── Scrollbar ── */
        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 999px; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* ── True-black dark mode ── */
        html.dark { background: #000; color-scheme: dark; }
        html.dark body { background: #000 !important; }

        /* ── Smooth page animation ── */
        #app-root > * { animation: fadeIn .25s ease-out; }

        /* ── Card hover lift ── */
        .card-lift { transition: transform .2s ease, box-shadow .2s ease; }
        .card-lift:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,0,0,.12); }
        .dark .card-lift:hover { box-shadow: 0 8px 30px rgba(0,0,0,.7); }

        /* ── Line clamp ── */
        .line-clamp-1 { display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; }
        .line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .line-clamp-3 { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
    </style>
</head>
<body class="bg-surface dark:bg-black text-on-surface dark:text-neutral-200 font-sans min-h-screen selection:bg-indigo-200/60 selection:text-indigo-900 transition-colors duration-150">
    
    <!-- Header: dark:bg-black so it matches the body exactly -->
    <header class="fixed top-0 inset-x-0 z-50 bg-white/90 dark:bg-black/90 backdrop-blur-xl border-b border-border-subtle dark:border-d-border" id="app-header">
    </header>

    <main class="w-full pt-16 bg-surface dark:bg-black min-h-[calc(100vh-64px)] pb-20 md:pb-0" id="app-root">
    </main>

    <!-- Mobile Bottom Nav -->
    <nav class="fixed bottom-0 inset-x-0 z-50 md:hidden bg-white/95 dark:bg-black/95 backdrop-blur-xl border-t border-border-subtle dark:border-d-border py-1" id="mobile-nav">
    </nav>

    <!-- Toast Container -->
    <div class="fixed top-20 right-6 z-[200] flex flex-col gap-2 pointer-events-none" id="toast-container"></div>
    
    <div id="ai-modal-container"></div>

    <script src="./views.js"></script>
    <script src="./views_auth.js"></script>
    <script src="./views_share.js"></script>
    <script src="./views_discover.js"></script>
    <script src="./views_detail.js"></script>
    <script src="./views_mod.js"></script>
    <script src="./views_activity.js"></script>
    <script src="./app.js"></script>
</body>
</html>
